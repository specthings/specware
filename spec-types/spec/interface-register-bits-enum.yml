spec-info:
  dict:
    attributes: {}
    description: |
      This set of attributes specifies the enumerators of a register bit
      field.  Each attribute name is the name of an enumerator.  Each
      attribute value is the field value or the field values of the
      enumerator.  A field of the ``uint`` kind or the ``int`` kind uses this
      set to name the values which are not ordinary numbers.  An enumerator
      name which YAML reads as a boolean needs quotes.  Examples are ``ON``,
      ``OFF``, ``YES`` and ``NO``.
    generic-attributes:
      description: null
      key-spec-type: str
      value-spec-type: interface-register-bits-enum-value
    mandatory-attributes: all
spec-name: Register Bit Field Enumerators
spec-type: interface-register-bits-enum
type: spec
