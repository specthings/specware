  spec-key: task-type
  spec-value: interface
  uid: tool-task
spec-description: null
spec-example: null
spec-info:
  dict:
    attributes:
      accepted-licenses:
        description: |
          It shall be the licenses which a produced file accepts for a part
          whose license expression permits not the license of the file.
        spec-type: list-str
      automatically-generated-warning:
        description: |
          It shall be the warning which every produced file carries.
          An empty warning adds no comment block to a file.
        spec-type: str
      domains:
        description: |
          It shall map a domain name to the directory of the domain.
        spec-type: str-to-str
      enabled:
        description: |
          It shall be the enabled set of the interface generation.
        spec-type: list-str
      item-level-interfaces:
        description: |
          It shall be the UIDs of the interface items which produce a file of
          their own.
        spec-type: list-uid
      license:
        description: |
          It shall be the license of a produced file which no rule of
          ``license-by-target`` matches.
        spec-type: spdx-license-identifier
      license-by-target:
        description: |
          It shall be the rules which state the license of a header file.  A
          pattern matches the ``path`` attribute of the header file item.
        spec-type: tool-target-license-list
    description: |
      This set of attributes specifies an interface generation task.
    mandatory-attributes:
    - license
spec-name: Tool Interface Task
spec-type: tool-task-interface
type: spec
