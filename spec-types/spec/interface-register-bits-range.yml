spec-info:
  list:
    description: |
      It shall be the closed interval of the ordinary values of a register bit
      field.  The first element is the lowest ordinary value.  The second
      element is the highest ordinary value.  A value outside the interval is
      a special value.  The ${interface-register-bits-enum:/spec-name} names
      the special values.
    spec-type: int
spec-name: Register Bit Field Value Range
spec-type: interface-register-bits-range
type: spec
