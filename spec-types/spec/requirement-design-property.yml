    description: |
      This set of attributes specifies a design property requirement.  A
      design property states a fact of the design which holds for a subset of
      the configurations, for example the instruction set architecture.  The
      ``enabled-by`` attribute of the design property selects the
      configurations.  An item which holds only under the design property
      links to it through the design property role.
    mandatory-attributes: all
