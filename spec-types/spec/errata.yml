spec-info:
  dict:
    attributes:
      identifier:
        description: |
          It shall be the identifier which the errata document gives the
          erratum.
        spec-type: str
      title:
        description: |
          It shall be the title which the errata document gives the erratum.
        spec-type: str
    description: |
      This set of attributes specifies an erratum of a part.  The item
      identifies the erratum and links to the errata document with the
      `reference` role.  The errata document states the defect, the affected
      parts and the workaround.  An item of a product links to the erratum
      with the `errata-resolution` role and states the resolution.
    mandatory-attributes: all
