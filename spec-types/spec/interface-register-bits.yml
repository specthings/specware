- role: spec-member
  uid: root
spec-description: null
spec-example: null
spec-info:
  none: null
  dict:
    attributes:
      properties:
        description: |
          It shall be the list of the properties of the bit field.  A property
          states what an access to the field does.
        spec-type: interface-register-bits-properties
      brief:
        description: null
        spec-type: interface-brief
      count:
        description: |
          It shall be the count of the bit fields of the run.  The manual
          gives a run of bit fields one name and a decimal index.  A field
          which has no count is a run of one.
        spec-type: int
      description:
        description: null
        spec-type: interface-description
      enum:
        description: null
        spec-type: interface-register-bits-enum
      first-index:
        description: |
          It shall be the index which the manual gives to the bit field at
          the start bit.  The default is ``0``.
        spec-type: int
      kind:
        description: null
        spec-type: interface-register-bits-kind
      name:
        description: |
          It shall be the name of the register bit field.
        spec-type: str
      range:
        description: null
        spec-type: interface-register-bits-range
      reset:
        description: null
        spec-type: interface-register-bits-reset
      scale:
        description: |
          It shall be the expression which computes the quantity from the
          value of the bit field.  The expression uses the Python syntax.  The
          name ``value`` denotes the value of the bit field.  An example is
          ``value + 1``.
        spec-type: str
      start:
        description: |
          It shall be the start bit of the bit field.  Bit ``0`` is the
          least-significant bit.  A run starts the field of the first index
          at this bit.
        spec-type: int
      stride:
        description: |
          It shall be the bit step from one index of the run to the next.  A
          negative stride counts down the register.  The default is the width
          of the bit field.
        spec-type: int
      unit:
        description: |
          It shall be the unit of the quantity which the bit field encodes.
          An example is ``bytes``.  Write the unit as one word.
        spec-type: str
      width:
        description: |
          It shall be the width in bits of the bit field.
        spec-type: int
    description: |
      This set of attributes specifies a register bit field.  Single bits are
      bit fields with a width of one.  The ``count``, ``enum``,
      ``first-index``, ``kind``, ``range``, ``reset``, ``scale``, ``stride``
      and ``unit`` attributes are optional.  An attribute which has no value
      is absent.

      A count greater than one specifies a run of bit fields.  The field of
      the index ``i`` starts at bit ``start + stride * ( i - first-index )``.
      The index runs from ``first-index`` to ``first-index + count - 1``.  The
      name is the base of the run and carries no index.
    mandatory-attributes:
    - brief
    - description
    - name
    - properties
    - start
    - width
spec-name: Register Bits Definition
spec-type: interface-register-bits
type: spec
