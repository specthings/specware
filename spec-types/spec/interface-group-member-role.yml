spec-info:
  dict:
    attributes: {}
    description: |
      It defines the interface group member role of links.  A link of this
      role goes from an ${interface-group:/spec-name} item to an
      ${interface-register-block:/spec-name} item.  It makes the register
      block a member of the group.  The register block needs no link to the
      group, so the group may reside in the tree of an operating system.
    mandatory-attributes: all
spec-name: Interface Group Member Link Role
