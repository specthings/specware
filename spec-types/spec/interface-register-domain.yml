spec-info:
  str:
    assert:
      in:
      - device
      - memory
    description: |
      It specifies the address domain of a register block.  The value
      ``device`` denotes a memory-mapped device register block.  The value
      ``memory`` denotes a register block which resides in normal memory, for
      example a DMA descriptor.  For the ``memory`` value, the register block
      size shall be present.
spec-name: Interface Register Domain
spec-type: interface-register-domain
type: spec
