spec-info:
  dict:
    attributes:
      aim:
        description: |
          If the value is present, it shall be the aim.
        spec-type: optional-str
      annex-section:
        description: |
          It shall be the section number within the annex, such as ``4.1``
          in the clause ``B.2.1<4.1>a``.
        spec-type: str
      bullet:
        description: |
          It shall be the requirement clause bullet.
        spec-type: str
      ecss-type:
        description: |
          It shall be the type of the clause.  If the attribute is absent, the
          clause is a requirement.
        spec-type: requirement-ecss-type
      expected-output:
        description: |
          If the value is present, it shall be the expected output.
        spec-type: optional-str
      name:
        description: |
          It shall be the requirement subject.
        spec-type: str
      notes:
        description: |
          It shall be the list of notes.
        spec-type: list-str
      section:
        description: |
          It shall be the requirement section number.  In an annex, it shall
          be the section number without the annex section, such as
          ``B.2.1`` in the clause ``B.2.1<4.1>a``.
        spec-type: str
    description: |
      This set of attributes specifies an ${/glossary/ecss:/term} requirement.
    mandatory-attributes:
    - aim
    - bullet
    - expected-output
    - name
    - notes
    - section
spec-name: ECSS Requirement Item Type
spec-type: requirement-ecss
type: spec
