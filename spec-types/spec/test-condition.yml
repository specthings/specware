    description: |
      This set of attributes specifies a condition of one or more test cases.
      A test case links to the condition with the `test-condition` role.
      The test plan presents the text in the section of each linked test case
      which the `section` attribute names.  A condition of the section
      `procedure-constraint` may link to a test procedure with the
      `test-condition-procedure` role.
