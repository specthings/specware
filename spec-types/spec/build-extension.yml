enabled-by: true
links:
- role: spec-member
  uid: root
- role: spec-refinement
  spec-key: build-type
  spec-value: extension
  uid: build
spec-description: null
spec-example: null
spec-info:
  dict:
    attributes:
      build-extension-points:
        description: |
          It shall be the list of UIDs associated with build extension points.
        spec-type: list-str
      build-path-prefix:
        description: |
          It shall be the path of a directory relative to the top-level
          directory of the build.  The paths of the build items of the
          extension shall be relative to this directory.
        spec-type: str
      build-rules:
        description: |
          It shall be the rule lists of the extension.  A consumer of the build
          reads the rule lists of its key.
        spec-type: build-rules
      build-spec-directories:
        description: |
          It shall be the list of directory paths containing the build
          specification items of the extension.  The directory paths shall be
          relative to the directory of the build extension item file.
        spec-type: list-str
    description: |
      This set of attributes specifies a build extension.  The build items
      provided by the extension are only loaded and accessed if the build
      extension item is enabled.
    mandatory-attributes:
    - build-extension-points
    - build-spec-directories
spec-name: Build Extension Item Type
spec-type: build-extension
type: spec
