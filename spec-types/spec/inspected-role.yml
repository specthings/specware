spec-info:
  dict:
    attributes:
      scopes:
        description: |
          It shall be the list of inspected scopes of the link target.
        spec-type: inspection-scope-list
    description: |
      It defines the inspected role of links.  The link target shall be the
      inspected artefact.  For file scopes it shall be an item with a
      directory attribute, for item scopes it shall be the inspected item
      itself, and for finding scopes it shall be an analysis item.
    mandatory-attributes: all
spec-name: Inspected Link Role
spec-type: inspected-role
