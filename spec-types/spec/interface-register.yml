spec-info:
  dict:
    attributes:
      bits:
        description: null
        spec-type: interface-register-bits-directive-list
      brief:
        description: null
        spec-type: interface-brief
      description:
        description: null
        spec-type: interface-description
      locator:
        description: |
          It shall be the place of the register within the work of a link
          with the ``reference`` role.  The format of the place is specific to
          the work.  An example is ``41.7.2, p. 1389``.
        spec-type: str
      name:
        description: |
          It shall be the name to identify the register definition.  The name
          shall be unique within the scope of the
          ${interface-register-block-include-role:/spec-name} links of the item
          and the ${interface-register-list:/spec-name}.
        spec-type: str
      width:
        description: |
          It shall be the width of the register in bits.
        spec-type: int
    description: |
      This set of attributes specifies a register.  The ``locator`` attribute
      is optional.  An attribute which has no value is absent.
    generic-attributes:
      description: null
      key-spec-type: name
      value-spec-type: any
    mandatory-attributes:
    - bits
    - brief
    - description
    - name
    - width
spec-name: Register Definition
