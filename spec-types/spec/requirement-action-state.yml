spec-info:
  dict:
    attributes:
      name:
        description: null
        spec-type: requirement-action-name
      representatives:
        description: |
          If the value is present, then it shall be the list of representatives of the
          pre-condition state. For each variant of the transition map, the generated test
          runs the action once for each representative index up to the largest
          representative count of the pre-condition states of the variant. A state with
          fewer representatives repeats its last representative. Each representative of a
          state therefore runs at least once in each variant which prepares the state,
          unless its code skips the run. The generated test checks that each
          representative of a state ran, if the state ran. A post-condition state shall
          have no representatives.
        spec-type: requirement-action-representative-list
      test-code:
        description: |
          If the value is present, then it shall be the test code to prepare or check the
          state of the condition. For a state with representatives, the code runs after
          the code of the representative. The code may use a local variable `ctx` which
          points to the test context, see ${test-context:/spec-name}. If the value is
          null, then the state shall have representatives.
        spec-type: optional-clang-function-scope
      text:
        description: |
          It shall define the state of the condition.
        spec-type: requirement-text
    description: |
      This set of attributes defines an action pre-condition or post-condition state.
    mandatory-attributes:
    - name
    - test-code
    - text
spec-name: Action Requirement State
spec-type: requirement-action-state
type: spec
