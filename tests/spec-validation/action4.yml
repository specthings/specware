pre-conditions:
- name: Value
  states:
  - name: Zero
    test-code: |
      ctx->value = 0;
    text: |
      While the value is zero.
  - name: Positive
    representatives:
    - name: One
      test-code: |
        ctx->value = 1;
    - name: Max
      test-code: |
        ctx->value = UINT32_MAX;
    test-code: |
      ctx->sign = 1;
    text: |
      While the value is greater than zero.
  test-epilogue: null
  test-prologue: null
- name: Object
  states:
  - name: Valid
    representatives:
    - name: First
      test-code: |
        ctx->object = 1;
    - name: Last
      test-code: |
        ctx->object = 3;
    test-code: null
    text: |
      While the object is valid.
  - name: Invalid
    test-code: |
      ${.:skip}
    text: |
      While the object is invalid.
  test-epilogue: null
  test-prologue: null
- name: Mode
  states:
  - name: Fast
    representatives:
    - name: Flat
      test-code: |
        ctx->depth = 0;
    - name: Deep
      test-code: |
        ctx->depth = 1;
    - name: Nested
      test-code: |
        ctx->depth = 2;

        if ( ctx->value == 1 ) {
          ${.:skip}
        }
    test-code: |
      ctx->fast = 1;
    text: |
      While the mode is fast.
  - name: Slow
    test-code: |
      ctx->fast = 0;
    text: |
      While the mode is slow.
  test-epilogue: null
  test-prologue: null
